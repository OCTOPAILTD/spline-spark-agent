sonar.projectKey=OCTOPAILTD:spline-spark-agent
sonar.projectName=OCTOPAILTD:spline-spark-agent

sonar.sources=core,commons

# Classify test code: analyzed for quality, excluded from LOC billing
sonar.tests=core,commons,integration-tests
sonar.test.inclusions=**/*Spec.*,**/*Test.*,**/*Tests.*

# Examples, packaging modules, CI scripts, and build artifacts
sonar.exclusions=examples/**,dev/**,bundle-*/**,build-all.sh,**/.github/**,**/Dockerfile*,**/target/**,**/.vs/**,**/.vscode/**,**/.idea/**

sonar.cpd.exclusions=**/*Spec.*,**/*Test.*,**/*Tests.*
